server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stockmarket

  # 1. PostgreSQL & JPA (영구 저장소) 설정
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # 이미 도커로 schema.sql을 주입했으므로 검증만 수행 (안전)
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # 2. Redis (초고속 캐시/전광판) 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

app:
  auth:
    email:
      from: ${MAIL_FROM}
      code-ttl-seconds: ${AUTH_EMAIL_CODE_TTL_SECONDS}
      verified-ttl-seconds: ${AUTH_EMAIL_VERIFIED_TTL_SECONDS}
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-validity-seconds: ${AUTH_ACCESS_TOKEN_VALIDITY_SECONDS}
      refresh-token-validity-seconds: ${AUTH_REFRESH_TOKEN_VALIDITY_SECONDS}
      refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME}
      refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE}
      refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE}
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED}
      fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE}
      send-timeout-seconds: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_SECONDS}
  kafka:
    consumer:
      enabled: ${KAFKA_CONSUMER_ENABLED:true}
    order-consumer:
      enabled: ${KAFKA_ORDER_CONSUMER_ENABLED:${KAFKA_CONSUMER_ENABLED:true}}
    trade-consumer:
      enabled: ${KAFKA_TRADE_CONSUMER_ENABLED:${KAFKA_CONSUMER_ENABLED:true}}
  realtime:
    snapshot:
      flush-interval-ms: ${REALTIME_SNAPSHOT_FLUSH_INTERVAL_MS:100}

# 3. Kafka 자동설정은 일단 인프라 띄우기 전까지 주석 처리하거나 exclude에 남겨둘 수 있어.
# 지금은 완전히 빈틈없이 인프라를 붙이기 위해 kafka 관련 exclude만 남기거나 
# 추후 셋업할 예정이므로 일단 이대로 쾌적하게 시작하자!
