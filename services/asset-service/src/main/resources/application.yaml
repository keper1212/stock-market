server:
  port: ${ASSET_SERVICE_PORT:8088}

spring:
  application:
    name: asset-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
    consumer:
      group-id: ${KAFKA_ASSET_CONSUMER_GROUP_ID:stockmarket-asset}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A newly deployed asset-service must not settle historical trade events again.
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      ack-mode: manual

app:
  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
  kafka:
    asset-consumer:
      enabled: ${KAFKA_ASSET_CONSUMER_ENABLED:true}
  outbox:
    publisher:
      enabled: ${ASSET_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${ASSET_OUTBOX_PUBLISHER_FIXED_DELAY_MS:100}
      batch-size: ${ASSET_OUTBOX_PUBLISHER_BATCH_SIZE:200}
      send-timeout-seconds: ${ASSET_OUTBOX_PUBLISHER_SEND_TIMEOUT_SECONDS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
