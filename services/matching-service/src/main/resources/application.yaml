server:
  port: ${MATCHING_SERVICE_PORT:8083}

spring:
  application:
    name: matching-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:stockmarket-matching}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

app:
  matching-outbox:
    publisher:
      enabled: ${MATCHING_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${MATCHING_OUTBOX_PUBLISHER_FIXED_DELAY_MS:100}
      batch-size: ${MATCHING_OUTBOX_PUBLISHER_BATCH_SIZE:200}
      send-timeout-seconds: ${MATCHING_OUTBOX_PUBLISHER_SEND_TIMEOUT_SECONDS:5}
  kafka:
    order-consumer:
      enabled: ${KAFKA_ORDER_CONSUMER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
