server:
  port: ${SETTLEMENT_SERVICE_PORT:8084}

spring:
  application:
    name: settlement-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
    consumer:
      group-id: ${KAFKA_SETTLEMENT_CONSUMER_GROUP_ID:stockmarket-settlement}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

app:
  settlement-outbox:
    publisher:
      enabled: ${SETTLEMENT_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${SETTLEMENT_OUTBOX_PUBLISHER_FIXED_DELAY_MS:100}
      batch-size: ${SETTLEMENT_OUTBOX_PUBLISHER_BATCH_SIZE:200}
      send-timeout-seconds: ${SETTLEMENT_OUTBOX_PUBLISHER_SEND_TIMEOUT_SECONDS:5}
  kafka:
    trade-consumer:
      enabled: ${KAFKA_TRADE_CONSUMER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
        application: ${spring.application.name}
