server:
  port: ${AUTH_SERVICE_PORT:8087}

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}

app:
  auth:
    email:
      from: ${MAIL_FROM}
      code-ttl-seconds: ${AUTH_EMAIL_CODE_TTL_SECONDS}
      verified-ttl-seconds: ${AUTH_EMAIL_VERIFIED_TTL_SECONDS}
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-validity-seconds: ${AUTH_ACCESS_TOKEN_VALIDITY_SECONDS}
      refresh-token-validity-seconds: ${AUTH_REFRESH_TOKEN_VALIDITY_SECONDS}
      refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME}
      refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE}
      refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE}
