server:
  port: ${ORDER_SERVICE_PORT:8082}

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      ack-mode: manual

app:
  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:100}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:200}
      send-timeout-seconds: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_SECONDS:5}
  kafka:
    order-lifecycle-consumer:
      enabled: ${KAFKA_ORDER_LIFECYCLE_CONSUMER_ENABLED:true}
      group-id: ${KAFKA_ORDER_LIFECYCLE_CONSUMER_GROUP_ID:stockmarket-order-lifecycle}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
